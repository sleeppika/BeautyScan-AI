<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="emptyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff0f4" />
      <stop offset="100%" stop-color="#fae3eb" />
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#a04060" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Circular background -->
  <circle cx="80" cy="80" r="75" fill="url(#emptyGlow)" />
  
  <!-- Dashed focus guide circle -->
  <circle cx="80" cy="80" r="58" fill="none" stroke="#e6b8c8" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.8" />

  <!-- Centered cosmetic silhouette / magnifying search lens -->
  <g transform="translate(42, 38)" filter="url(#softShadow)">
    <!-- Cosmetic brush & compact minimalist outline -->
    <path d="M38 12 C38 6, 44 2, 48 2 C52 2, 58 6, 58 12 L56 36 L40 36 Z" fill="#d994a8" opacity="0.35" />
    <!-- Lipstick outline silhouette -->
    <rect x="22" y="38" width="16" height="34" rx="4" fill="#cf7a94" opacity="0.4" />
    <path d="M24 38 L24 24 C24 20 36 14 36 24 L36 38 Z" fill="#ba5372" opacity="0.5" />
    
    <!-- Large cute search icon overlay -->
    <circle cx="48" cy="46" r="20" fill="#ffffff" stroke="#a84c66" stroke-width="3" />
    <line x1="62" y1="60" x2="74" y2="72" stroke="#a84c66" stroke-width="4.5" stroke-linecap="round" />
    <!-- Sparkle inside lens -->
    <path d="M48 36 L49.5 43 L56 44.5 L49.5 46 L48 53 L46.5 46 L40 44.5 L46.5 43 Z" fill="#c75877" />
  </g>
</svg>
